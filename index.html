  .btn-gray { background: #78909c; }
  .btn-sm { padding: 10px 20px; font-size: 14px; width: auto; }
  .summary { background: #e3f2fd; color: #0d47a1; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; margin-bottom: 12px; }
  .region-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 14px; }
  .region-tab { flex: 0 0 auto; padding: 7px 14px; background: #fff; border: 1.5px solid #e0e0e0; border-radius: 16px; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; transition: all 0.15s; line-height: 1.2; }

<div class="header"><h1>领导干部民主测评</h1><p>吉林省社保系统</p></div>

<div class="steps" id="steps">

</div>

<!-- 验证码 -->

    <button class="btn" id="btnVerify">进入系统</button>
  </div>
</div>

<!-- 选地区+单位 -->
<div id="page-select" class="container hidden">
  <div class="card">
    <div class="card-title">请选择地区与单位</div>
    <label class="form-label">地区</label>
    <select class="select-box" id="regionSelect"><option value="">-- 请选择地区 --</option></select>
    <label class="form-label">单位</label>
    <select class="select-box" id="unitSelect" disabled><option value="">-- 请先选择地区 --</option></select>
    <button class="btn" id="btnEnterVote" disabled>进入测评</button>
  </div>
</div>

<!-- 测评 -->
<div id="page-vote" class="container hidden"><div id="cadreList"><div class="loading">加载中...</div></div></div>

<!-- 我的投票 -->
<div id="page-mine" class="container hidden">
  <div class="summary">您的测评已提交，以下为您的投票记录（不可修改）</div>
  <div id="mineList"></div>
</div>

<!-- 全部结果 -->
<div id="page-all" class="container hidden"><div id="allResultBox"></div></div>

<div class="footer-bar hidden" id="footerBar"><button class="btn" id="btnSubmit" disabled>提交测评</button></div>
<div class="container hidden" id="globalBtns" style="text-align:center; padding-top:0;">
  <button class="btn btn-gray" id="btnViewMine" style="margin-bottom:10px;">查看我的投票</button>
  <button class="btn btn-gray" id="btnViewAll">查看全部结果</button>
</div>

<div class="toast" id="toast"></div>

/* ============================================================
   全局状态
   ============================================================ */
const state = { region: '', unit: '', cadres: [], scores: {}, myVotes: null };

/* ============================================================
   工具
   ============================================================ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 1800);
}

function showPage(id) {
  ['page-code','page-select','page-vote','page-mine','page-all'].forEach(p => {
    document.getElementById(p).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0, 0);
}

function setStep(n) {
  document.querySelectorAll('#steps .s').forEach(el => {
    const s = Number(el.dataset.step);
    el.classList.remove('active','done');
    if (s < n) el.classList.add('done');
    if (s === n) el.classList.add('active');
  });
}

/* ============================================================
   步骤1：验证码
   ============================================================ */
document.getElementById('btnVerify').addEventListener('click', function () {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) { toast('请输入验证码'); return; }
  if (!DEMO_DATA.codes.includes(code)) { toast('验证码错误'); return; }

  const regionSel = document.getElementById('regionSelect');
  regionSel.innerHTML = '<option value="">-- 请选择地区 --</option>' +
    Object.keys(DEMO_DATA.regions).map(r => `<option value="${r}">${r}</option>`).join('');

  const unitSel = document.getElementById('unitSelect');
  unitSel.innerHTML = '<option value="">-- 请先选择地区 --</option>';
  unitSel.disabled = true;
  document.getElementById('btnEnterVote').disabled = true;

  setStep(2);
  showPage('page-select');
});

/* ============================================================
   步骤2：地区 + 单位联动
   ============================================================ */
const regionSelect = document.getElementById('regionSelect');
const unitSelect = document.getElementById('unitSelect');
const btnEnterVote = document.getElementById('btnEnterVote');

regionSelect.addEventListener('change', function () {
  const region = this.value;
  if (!region) {
    unitSelect.innerHTML = '<option value="">-- 请先选择地区 --</option>';
    unitSelect.disabled = true;
    btnEnterVote.disabled = true;
    return;
  }
  const units = DEMO_DATA.regions[region] || [];
  unitSelect.innerHTML = '<option value="">-- 请选择单位 --</option>' +
    units.map(u => `<option value="${u}">${u}</option>`).join('');
  unitSelect.disabled = false;
  btnEnterVote.disabled = true;
});

unitSelect.addEventListener('change', function () {
  btnEnterVote.disabled = !this.value;
});

btnEnterVote.addEventListener('click', function () {
  state.region = regionSelect.value;
  state.unit = unitSelect.value;
  if (!state.region || !state.unit) { toast('请选择地区和单位'); return; }

  state.cadres = DEMO_DATA.cadres[state.unit] || [];
  state.scores = {};
  renderCadres();

  document.getElementById('footerBar').classList.remove('hidden');
  document.getElementById('globalBtns').classList.add('hidden');
  setStep(3);
  showPage('page-vote');
});

/* ============================================================
   测评页
   ============================================================ */
function renderCadres() {
  const box = document.getElementById('cadreList');
  if (state.cadres.length === 0) {
    box.innerHTML = '<div class="loading">该单位暂无测评对象</div>';
    return;
  }

  const specialHtml = `
    <div class="card special-card">
      <div class="special-label">对该单位领导班子的整体评价</div>
      <div class="options">
        <div class="opt" data-sid="__team__" data-score="1">优秀</div>
        <div class="opt" data-sid="__team__" data-score="2">良好</div>
        <div class="opt" data-sid="__team__" data-score="3">一般</div>
        <div class="opt" data-sid="__team__" data-score="4">较差</div>
      </div>
    </div>
    <div class="card special-card">
      <div class="special-label">对该单位社保工作的满意度</div>
      <div class="options">
        <div class="opt" data-sid="__satisfaction__" data-score="1">优秀</div>
        <div class="opt" data-sid="__satisfaction__" data-score="2">良好</div>
        <div class="opt" data-sid="__satisfaction__" data-score="3">一般</div>
        <div class="opt" data-sid="__satisfaction__" data-score="4">较差</div>
      </div>
    </div>
    <div class="divider-title">以下为个人测评</div>
  `;

  const cadreHtml = state.cadres.map(c => `
    <div class="card">
      <div class="cadre-name">${c.name}</div>
      <div class="cadre-info">${state.unit} · ${c.position || ''}</div>
      <div class="options">
        <div class="opt" data-cid="${c.id}" data-score="1">优秀</div>
        <div class="opt" data-cid="${c.id}" data-score="2">良好</div>
        <div class="opt" data-cid="${c.id}" data-score="3">一般</div>
        <div class="opt" data-cid="${c.id}" data-score="4">较差</div>
      </div>
    </div>
  `).join('');

  box.innerHTML = specialHtml + cadreHtml;

  box.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.sid || el.dataset.cid;
      state.scores[key] = Number(el.dataset.score);
      el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      checkComplete();
    });
  });

  checkComplete();
}

function checkComplete() {
  const required = ['__team__', '__satisfaction__', ...state.cadres.map(c => String(c.id))];
  const done = required.every(k => state.scores[k]);
  document.getElementById('btnSubmit').disabled = !done;
}

/* ============================================================
   提交投票到 Supabase
   ============================================================ */
document.getElementById('btnSubmit').addEventListener('click', async function () {
  this.disabled = true; this.textContent = '提交中...';

  const cadreScores = state.cadres.map(c => ({
    cadreId: c.id, name: c.name, position: c.position, score: state.scores[c.id]
  }));

  // 本地用户标识，防止同一浏览器重复提交
  let uid = localStorage.getItem('szcp_uid');
  if (!uid) {
    uid = 'web-' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem('szcp_uid', uid);
  }

  const { error } = await supabaseClient.from('votes').insert({
    openid: uid,
    region: state.region,
    unit: state.unit,
    verify_code: document.getElementById('codeInput').value.trim(),
    team_score: state.scores['__team__'],
    satisfaction_score: state.scores['__satisfaction__'],
    cadre_scores: cadreScores
  });

  if (!error) {
    toast('投票成功，不可修改');
    state.myVotes = {
      teamScore: state.scores['__team__'],
      satisfactionScore: state.scores['__satisfaction__'],
      cadreScores
    };
    document.getElementById('footerBar').classList.add('hidden');
    document.getElementById('globalBtns').classList.remove('hidden');
    setTimeout(() => showMyVotes(), 800);
  } else {
    console.error(error);
    if (error.code === '23505') {
      toast('您已提交过该单位的测评');
    } else {
      toast('提交失败：' + (error.message || '未知错误'));
    }
    this.disabled = false; this.textContent = '提交测评';
  }
});

/* ============================================================
   查看我的投票
   ============================================================ */
document.getElementById('btnViewMine').addEventListener('click', showMyVotes);

function showMyVotes() {
  if (!state.myVotes) { toast('您还没有提交测评'); return; }
  setStep(3);
  showPage('page-mine');

  const scoreText = { 1: '优秀', 2: '良好', 3: '一般', 4: '较差' };
  const box = document.getElementById('mineList');

  const specialHtml = `
    <div class="card special-card">
      <div class="special-label">对该单位领导班子的整体评价</div>
      <div class="options">
        ${[1,2,3,4].map(n => `<div class="opt ${state.myVotes.teamScore === n ? 'active' : 'disabled'}">${scoreText[n]}</div>`).join('')}
      </div>
    </div>
    <div class="card special-card">
      <div class="special-label">对该单位社保工作的满意度</div>
      <div class="options">
        ${[1,2,3,4].map(n => `<div class="opt ${state.myVotes.satisfactionScore === n ? 'active' : 'disabled'}">${scoreText[n]}</div>`).join('')}
      </div>
    </div>
    <div class="divider-title">以下为个人测评</div>
  `;

  const cadreHtml = state.cadres.map(c => {
    const s = state.scores[c.id];
    return `
      <div class="card">
        <div class="cadre-name">${c.name}</div>
        <div class="cadre-info">${state.unit} · ${c.position || ''}</div>
        <div class="options">
          ${[1,2,3,4].map(n => `<div class="opt ${s === n ? 'active' : 'disabled'}">${scoreText[n]}</div>`).join('')}
        </div>

  box.innerHTML = specialHtml + cadreHtml;
}

/* ============================================================
   查看全部结果
   ============================================================ */
document.getElementById('btnViewAll').addEventListener('click', function () {
  openPwdModal(async function (pwd) {
    if (pwd !== '0623') { toast('密码错误'); return false; }

    wx.showLoading && wx.showLoading({ title: '查询中...' });

    const { data, error } = await supabaseClient.from('votes').select('*');

    wx.hideLoading && wx.hideLoading();

    if (error) {
      console.error(error);
      toast('查询失败：' + (error.message || '未知错误'));
      return false;
    }

    // 本地聚合
    const regionMap = {};
    data.forEach(vote => {
      const { region, unit } = vote;
      if (!regionMap[region]) regionMap[region] = {};
      if (!regionMap[region][unit]) {
        regionMap[region][unit] = {
          team: [0,0,0,0],
          sat: [0,0,0,0],
          cadres: {}
        };
      }
      const u = regionMap[region][unit];

      u.team[vote.team_score - 1]++;
      u.sat[vote.satisfaction_score - 1]++;

      let scores = vote.cadre_scores;
      if (typeof scores === 'string') {
        try { scores = JSON.parse(scores); } catch (e) { return; }
      }
      if (!Array.isArray(scores)) return;

      scores.forEach(item => {
        const key = String(item.cadreId);
        if (!u.cadres[key]) {
          u.cadres[key] = {
            name: item.name,
            position: item.position,
            scores: [0,0,0,0]
          };
        }
        u.cadres[key].scores[item.score - 1]++;
      });
    });

    renderAllResult(regionMap);
    showPage('page-all');
    return true;
  });
});

function openPwdModal(onConfirm) {
  const modal = document.createElement('div');
  modal.className = 'pwd-modal';
  modal.innerHTML = `
    <div class="pwd-card">
      <h3>请输入查看密码</h3>
      <input type="password" id="modalPwd" maxlength="10" placeholder="请输入密码">
      <div class="pwd-btns">
        <button class="btn btn-gray" id="modalCancel">取消</button>
        <button class="btn" id="modalOk">确定</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  const input = modal.querySelector('#modalPwd');
  setTimeout(() => input.focus(), 100);
  const close = () => modal.remove();

  modal.querySelector('#modalCancel').addEventListener('click', close);
  modal.querySelector('#modalOk').addEventListener('click', async function () {
    const pwd = input.value.trim();
    if (!pwd) { toast('请输入密码'); return; }
    const ok = await onConfirm(pwd);
    if (ok) close();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') modal.querySelector('#modalOk').click();
  });
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
}

/* ============================================================
   渲染全部结果
   ============================================================ */
function renderAllResult(regionMap) {
  const regions = Object.keys(regionMap);
  if (regions.length === 0) {
    document.getElementById('allResultBox').innerHTML = '<div class="loading">暂无投票数据</div>';
    return;
  }
  let currentPage = 1;

  function renderPage(page) {
    const region = regions[page - 1];
    if (!region) return;

    const unitMap = regionMap[region];
    const tabsHtml = regions.map((r, idx) => `
      <div class="region-tab ${idx === page - 1 ? 'active' : ''}" data-page="${idx + 1}">
        ${r}<span class="tab-count">${Object.keys(regionMap[r]).length}</span>
      </div>
    `).join('');

    const groupsHtml = Object.entries(unitMap).map(([unit, data]) => {
      const teamTotal = data.team.reduce((a,b) => a+b, 0);
      const satTotal = data.sat.reduce((a,b) => a+b, 0);

      const teamCard = renderSimpleCard('领导班子整体评价', data.team, teamTotal, true, '整体测评');
      const satCard = renderSimpleCard('社保工作满意度', data.sat, satTotal, true, '整体测评');

      const persons = Object.entries(data.cadres);
      const personHtml = persons.map(([id, c]) => {
        const total = c.scores.reduce((a,b) => a+b, 0);
        return renderSimpleCard(c.name, c.scores, total, false, c.position);
      }).join('');

      return `
        <div class="unit-block">
          <div class="unit-title">
            <span class="unit-name">${unit}</span>
            <span class="unit-count">${persons.length} 人</span>
          </div>
          ${teamCard}
          ${satCard}
          ${persons.length > 0 ? '<div class="divider-title">以下为领导个人测评</div>' : ''}
          ${personHtml}
        </div>
      `;
    }).join('');

    document.getElementById('allResultBox').innerHTML = `
      <div style="text-align:right; margin-bottom:10px;">
        <button class="btn btn-sm" id="btnBackFromAll" style="background:#78909c;">返 回</button>
      </div>
      <div class="region-tabs">${tabsHtml}</div>
      <div id="resultItems">${groupsHtml}</div>
    `;

    document.querySelectorAll('.region-tab').forEach(tab => {
      tab.addEventListener('click', function () {
        renderPage(Number(this.dataset.page));
      });
    });
    document.getElementById('btnBackFromAll').addEventListener('click', () => showPage('page-mine'));
  }

  renderPage(1);
}

function renderSimpleCard(name, scores, total, isSpecial, position) {
  const labels = ['优秀', '良好', '一般', '较差'];
  const bars = ['bar-1', 'bar-2', 'bar-3', 'bar-4'];
  const rate = n => total === 0 ? '0.0' : (n / total * 100).toFixed(1);

  return `
    <div class="card ${isSpecial ? 'special-card' : ''}">
      <div class="cadre-head">
        <div>
          <div class="cadre-name" style="${isSpecial ? 'color:#e65100;' : ''}">${name}</div>
          <div class="cadre-info" style="margin-bottom:0;">${position || ''}</div>
        </div>
        <div class="cadre-total">总票数 <b>${total}</b></div>
      </div>
      <div class="stat-table">
        <div class="stat-head">
          <span class="col-label">等次</span><span class="col-bar">占比</span>
          <span class="col-count">得票数</span><span class="col-rate">得票率</span>
        </div>
        ${labels.map((label, i) => `
          <div class="stat-row">
            <span class="col-label">${label}</span>
            <div class="col-bar"><div class="stat-bar"><div class="stat-bar-fill ${bars[i]}" style="width:${rate(scores[i])}%"></div></div></div>
            <span class="col-count">${scores[i]} 票</span>
            <span class="col-rate">${rate(scores[i])}%</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
